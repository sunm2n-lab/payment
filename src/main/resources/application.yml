spring:
  application:
    name: payment

  datasource:
    # 로컬 docker-compose 기준. 테스트에서는 Testcontainers 연결 정보가 이 값을 덮어쓴다
    url: jdbc:mysql://localhost:3306/payment
    username: payment
    password: payment
    hikari:
      maximum-pool-size: 10 # S8 실험의 기준값
      connection-timeout: 30000 # 커넥션 획득 타임아웃

  jpa:
    open-in-view: false # SCENARIO 102행 - Phase 0 부터 고정
    hibernate.ddl-auto: validate # 스키마는 Flyway 만 만든다 (SCENARIO 81행)

  flyway:
    enabled: true # 로컬 시드는 Flyway 이력 밖에서 실행한다 (PHASE0.md 4.2)

server:
  port: 8080

management:
  endpoints.web.exposure.include: health,metrics # S8 의 Hikari 메트릭 관측용

logging:
  level:
    # 코드 순서가 아닌 실제 SQL 순서로 분석한다 (SCENARIO 98행)
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
