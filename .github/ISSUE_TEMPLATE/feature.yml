name: Feature
description: 새로운 기능이나 동작을 제안합니다.
title: "feat: "
labels:
  - "type: feat"
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 이 기능이 필요한 이유와 해결하려는 문제를 작성해 주세요.
      placeholder: 현재 상황과 문제를 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 추가하거나 변경할 기능을 구체적으로 작성해 주세요.
      placeholder: |
        - 추가할 API 또는 동작
        - 변경할 도메인 규칙
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 작업 완료를 판단할 수 있는 검증 가능한 조건을 작성해 주세요.
      placeholder: |
        - [ ] 조건 1
        - [ ] 조건 2
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: 제외 범위
      description: 이번 작업에서 의도적으로 다루지 않을 내용을 작성해 주세요.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 문서, 이슈 또는 코드 위치가 있다면 작성해 주세요.
    validations:
      required: false
