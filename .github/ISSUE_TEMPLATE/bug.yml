name: Bug
description: 의도한 동작과 다른 문제를 보고합니다.
title: "fix: "
labels:
  - "type: fix"
body:
  - type: textarea
    id: actual-behavior
    attributes:
      label: 실제 동작
      description: 현재 어떤 문제가 발생하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 기대 동작
      description: 원래 의도한 동작을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 반복해서 확인할 수 있는 절차와 입력값을 작성해 주세요.
      placeholder: |
        1. 준비 조건
        2. 실행한 요청 또는 명령
        3. 확인된 결과
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 문제가 환경에 따라 달라질 수 있다면 버전과 설정을 작성해 주세요.
      placeholder: MySQL 버전, 격리 수준, 애플리케이션 설정 등
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: 근거 자료
      description: 관련 로그, 오류 메시지, SQL 또는 스크린샷을 첨부해 주세요.
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 수정 여부를 검증할 수 있는 조건을 작성해 주세요.
      placeholder: |
        - [ ] 재현 테스트가 수정 전 실패한다.
        - [ ] 수정 후 테스트와 회귀 테스트가 통과한다.
    validations:
      required: true
