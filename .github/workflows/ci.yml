name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치/PR에 새 푸시가 오면 진행 중인 이전 실행을 취소한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    # Phase 0에서 도입할 Testcontainers가 러너의 Docker 데몬을 그대로 쓸 예정이다. Docker는 ubuntu 러너에만 있으므로 OS 매트릭스는 두지 않는다
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # action-junit-report가 check run을 만들기 위해 필요
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 의존성 캐시 + gradle-wrapper.jar 검증(기본 활성화)
      - uses: gradle/actions/setup-gradle@v6

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Test
        run: ./gradlew test

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: build/test-results/test/TEST-*.xml
          check_name: JUnit Test Report

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests
          if-no-files-found: ignore
